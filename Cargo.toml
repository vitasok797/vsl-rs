[package]
name = "vsl"
version = "0.1.0"
edition = "2024"

[profile.dev-static]
inherits = "dev"

[profile.release-static]
inherits = "release"

[lints.clippy]
as_conversions = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
str_to_string = "warn"
# cargo = "warn"

pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
